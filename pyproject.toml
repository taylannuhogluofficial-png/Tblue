[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tblue"
version = "1.0.1"
description = "Open source passive blue-team security scanner for website owners"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Taylan Nuhoğlu", email = "taylannuhogluofficial@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "security", "scanner", "blue-team", "penetration-testing",
    "vulnerability", "web-security", "passive-scanning", "owasp",
    "csp", "cors", "jwt", "xss", "ssrf"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "urllib3>=2.0.0",
    "dnspython>=2.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0", "pytest-cov", "pytest-xdist", "pytest-json-report"]

[project.scripts]
tblue = "tblue.cli:main"
tblue-mcp = "tblue.mcp_server:main"

[project.urls]
Homepage = "https://github.com/taylannuhogluofficial-png/Tblue"
Repository = "https://github.com/taylannuhogluofficial-png/Tblue"
"Bug Tracker" = "https://github.com/taylannuhogluofficial-png/Tblue/issues"

[tool.setuptools.packages.find]
include = ["tblue*"]

[tool.setuptools.package-data]
tblue = ["py.typed"]
