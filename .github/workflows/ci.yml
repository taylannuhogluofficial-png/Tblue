name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # pyproject advertises 3.10 through 3.13. Test all of them, or stop claiming them.
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

  # The invariants that carry security weight. Same tests as above, called out
  # separately so a failure names the property that broke rather than just "tests".
  invariants:
    name: security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Default scan sends no uninvited traffic
        run: pytest tests/test_passive_by_default.py -q --tb=short

      - name: Credentials never reach a third party
        run: pytest tests/test_credential_scoping.py -q --tb=short

      - name: Credentials never survive an off-target redirect
        run: pytest tests/test_redirect_scoping.py -q --tb=short

      - name: CI gates fail on findings, not just score
        run: pytest tests/test_severity_gate.py -q --tb=short

      - name: ATT&CK mappings are real techniques
        run: pytest tests/test_mitre_catalogue.py -q --tb=short

  # Dogfood action.yml — it is published for other people to use, so it should
  # not be the one thing nothing runs. Scans a local server, no external network.
  action:
    name: composite action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve a target on localhost
        run: |
          mkdir -p /tmp/site
          printf '<html><body><h1>ci target</h1></body></html>' > /tmp/site/index.html
          python3 -m http.server 8099 --directory /tmp/site &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8099/ >/dev/null && break
            sleep 0.5
          done

      - name: Run the action
        id: scan
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8099
          depth: '1'
          only: headers,csp,cookies,clickjacking
          fail-on: high
          report: ci-report.html

      - name: The action must produce a report and a usable exit code
        run: |
          test -f ci-report.html || { echo "action produced no report"; exit 1; }
          code="${{ steps.scan.outputs.exit-code }}"
          echo "action exit code: ${code:-<unset>}"
          case "$code" in
            0|1) ;;
            *) echo "expected 0 or 1 from a completed scan, got '${code:-<unset>}'"; exit 1 ;;
          esac
